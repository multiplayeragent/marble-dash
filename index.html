<script type="module">
/* ═══ MARBLE DASH · a Multiplayer Agent starter ═══════════════════════════════════════
 * Everyone rolls a marble down the same sky course at once; first to the goal wins.
 * Party, 2–8 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ marble physics, timers, bots, and the COURSE: a list of pieces, in order
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the shared clock
 *   COURSE ........ turns CONFIG.course into boxes (floors, ramps, rails, movers, the sweeper)
 *                   and a centre line (for progress and the bots)
 *   PHYSICS ....... one function rolls any marble (you or a bot): push, jump, bounce, ride
 *   WORLD ......... sky, clouds, the course meshes, flags, the goal, the marbles, effects
 *   RACE (HOST) ... the round's phases (start, race, done) and the bots. Only the host writes these.
 *   ME ............ rolling, checkpoints, falling, finishing. Each player writes only its own.
 *   HUD & RESULTS . place, checkpoint, timer, countdown, results, leaderboard
 *   INPUT ......... keyboard, and a touch stick plus a Jump button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player rolls its OWN marble and writes it to its entity as `m` (one packed JSON
 *     field: round id, position, velocity, checkpoint, progress, finish time) about 15 times
 *     a second, plus `hb` (heartbeat) once a second and `n`/`c` (name, color) once.
 *   - Marbles bump each other: each player pushes its own marble out of the others it
 *     touches, so a bump looks the same from both sides without anyone writing anyone else.
 *   - Effects need no messages: every client works out from a marble's position and finish
 *     time when it hits a bumper or reaches the goal (viewEffects), bots included.
 *   - Movers and the sweeper move on a SHARED CLOCK: their position is a function of time,
 *     so nobody streams them. The host writes `clk` (its clock) every 2 seconds and everyone
 *     else keeps the offset.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes `race` (id, version `v`, phase, start
 *     and end times, results), `bots` and `clk`. A new host adopts them and carries on.
 *   - A new round starts only when the host bumps race.id; every client then puts its marble
 *     back on the start pad. Someone who joins mid-round starts from the start pad.
 *   - Intent: "again" {} from the results card asks the host to start the next round now.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fastest-run": each player's best time to the goal (stored as
 *     600000 - ms, so higher is better), shown on the results card.
 */

    { type: "slope", len: 26, drop: 8, w: 8, rails: true },
    { type: "straight", len: 5, w: 8, rails: true },

// ── COURSE ──────────────────────────────────────────────────────────────────────────
// A cursor walks the course: each piece adds boxes in front of it (x = across, left is +;

  if (host.raceId !== r.id) { host.raceId = r.id; if (r.phase === "grid") spawnBots(humans); }
  else if (r.phase === "grid" && host.bots.size !== Math.max(0, CONFIG.seats - humans.length)) spawnBots(humans); // someone joined or left before GO
  const wall = clock();
  if (r.phase === "grid" && wall >= r.startAt) r = writeRace({ ...r, phase: "race" });
  if (r.phase === "race") {
    const all = racers(), done = all.filter((x) => x.ft);
    const humansDone = all.filter((x) => !x.bot && (!ATTRACT || !x.mine)).every((x) => x.ft);
    if (done.length && !r.endsAt) r = writeRace({ ...r, endsAt: wall + CONFIG.afterFirst });
    if ((done.length && humansDone && humans.length) || (r.endsAt && wall > r.endsAt) || wall - r.startAt > CONFIG.timeLimit || (ATTRACT && done.length >= 2)) {
      r = writeRace({ ...r, phase: "done", endsAt: wall + CONFIG.resultsFor, results: all.map((x) => ({ id: x.id, n: x.mine ? myName : x.name, c: x.color, ft: x.ft || 0, cp: x.cp || 0 })) });
    }
  }
  if (r.phase === "done" && wall > r.endsAt) r = newRace(r.id + 1);
  for (const b of host.bots.values()) {
    const racing = r.phase === "race" && !b.ft;
    b.lane += (Math.sin(now / 1700 + b.seed) * 0.6 - b.lane) * dt;
    const ev = stepMarble(b.m, racing ? botInput(b, t) : { x: -b.m.v.x * 0.2, z: -b.m.v.z * 0.2, jump: false }, dt);
    if (ev === "bump") beepAt(b.m.p, 520, 0.06, "square", 0.05);
    if (b.m.ground && b.m.ground.cp > b.cp) b.cp = b.m.ground.cp;
    if (racing && b.m.ground && b.m.ground.goal) b.ft = Math.round(wall - r.startAt); // its confetti is drawn by viewEffects(), on every client
    if (b.m.s > b.bestS + 1) { b.bestS = b.m.s; b.stuckAt = now; } else if (!b.stuckAt) b.stuckAt = now;
    if (fallen(b.m) || (racing && now - b.stuckAt > 12000)) { b.m = newMarble(spawnAt(b.cp, b.slot)); b.m.li = course.cps[Math.min(b.cp, course.cps.length - 1)].li; b.stuckAt = now; b.bestS = 0; }
  }
  separateBots();
  if (now - host.lastBots > 100) {
    host.lastBots = now;
    const f = (v) => +v.toFixed(2);
    net.setShared("bots", JSON.stringify(botList().map((b) => ({ ...b, x: f(b.x), y: f(b.y), z: f(b.z), vx: f(b.vx), vy: f(b.vy), vz: f(b.vz), s: +b.s.toFixed(1), sk: f(b.sk) }))));
  }
}
const beepAt = (p, ...a) => { if (p.distanceTo(me.m.p) < 25) beep(...a); };
/** Bots' marbles bump each other (both move) and bump out of players' marbles (only the bot moves). */
function separateBots() {
  const bots = [...host.bots.values()].map((b) => b.m), others = [me.m, ...[...views.entries()].filter(([id]) => !host.bots.has(id)).map(([, v]) => v)];
  bots.forEach((a, i) => {
    for (const o of [...bots.slice(i + 1), ...others]) {
      const d = a.p.distanceTo(o.p); if (d >= R * 2 || d < 1e-4) continue;
      const both = bots.includes(o), push = (R * 2 - d) * (both ? 0.5 : 1);
      _d.copy(a.p).sub(o.p).divideScalar(d); a.p.addScaledVector(_d, push);
      const rel = _d.dot(_bv.copy(a.v).sub(o.v));
      if (rel < 0) { a.v.addScaledVector(_d, -rel * (both ? 0.55 : 1.1)); if (both) { o.p.addScaledVector(_d, -push); o.v.addScaledVector(_d, rel * 0.55); } }
    }
  });
}

// ── ME ──────────────────────────────────────────────────────────────────────────────
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
  ["Speedy", "Bouncy", "Shiny", "Lucky", "Zippy", "Rolly"][Math.floor(Math.random() * 6)] + " " + ["Marble", "Pebble", "Orb", "Bead", "Comet"][Math.floor(Math.random() * 5)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
/** Two people joined at once in one color: the one with the higher sessionId picks a free one. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botList().map((b) => b.c)]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); if (me.g) { scene.remove(me.g); me.g = null; } }
}
const me = { m: newMarble(spawnAt(0, 0)), g: null, cp: 0, ft: 0, raceId: -1, slot: 0, best: 0, lastSend: 0, submitted: -1, bumpCd: 0, lane: 0 };
const input = { up: false, down: false, left: false, right: false, jump: false, sx: 0, sy: 0 };

/** My start spot: my place among the live players, or the first one no other player is in. */
function mySlot(r) {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => parse(p.m, null)).filter((k) => k && k.r === r.id);
  let n = Math.max(0, livePlayers().indexOf(net.sessionId));
  while (n < 16 && others.some((k) => Math.hypot(k.x - spawnAt(0, n).x, k.z - spawnAt(0, n).z) < 1.2)) n++;
  return n;
}
function resetToStart(r) {
  me.raceId = r.id; me.slot = ATTRACT ? CONFIG.seats : r.phase === "grid" ? mySlot(r) : Math.floor(Math.random() * 8);
  me.m = newMarble(spawnAt(0, me.slot)); me.cp = 0; me.ft = 0;
  $("over").hidden = true;
}
function myTick(dt, r, t, now) {
  if (me.raceId !== r.id) resetToStart(r);
  const racing = r.phase === "race" && !me.ft;
  let inp = { x: 0, z: 0, jump: false };
  if (racing && ATTRACT) inp = botInput(me, t);
  else if (racing) { // forward = away from the camera; right = screen right
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw), iz = (input.up ? 1 : 0) - (input.down ? 1 : 0) - input.sy, ix = (input.right ? 1 : 0) - (input.left ? 1 : 0) + input.sx;
    let x = fx * iz - fz * ix, z = fz * iz + fx * ix; const l = Math.hypot(x, z); if (l > 1) { x /= l; z /= l; }
    inp = { x, z, jump: input.jump };
  } else inp = { x: -me.m.v.x * 0.3, z: -me.m.v.z * 0.3, jump: false }; // not racing: hold still on the start pad, and stop at the goal instead of rolling off it
  input.jump = false;
  const ev = stepMarble(me.m, inp, dt);
  if (ev === "jump") beep(520, 0.1, "triangle", 0.08, 760);
  if (ev === "bump") { beep(620, 0.08, "square", 0.08); burst(me.m.p, "#ffcf3f", 10, 4); }
  if (ev === "knock") { beep(160, 0.25, "sawtooth", 0.08); burst(me.m.p, "#ffffff", 12, 4); }
  if (ev === "land" && Math.abs(me.m.v.y) > 0) beep(140, 0.06, "sine", 0.06);
  // marbles bump: I push my own marble out of everyone else's
  for (const v of views.values()) {
    const d = me.m.p.distanceTo(v.p);
    if (d < R * 2 && d > 1e-4) {
      _d.copy(me.m.p).sub(v.p).divideScalar(d); me.m.p.addScaledVector(_d, R * 2 - d);
      const rel = _d.dot(_bv.copy(me.m.v).sub(v.v)); if (rel < 0) me.m.v.addScaledVector(_d, -rel * 1.1);
      if (now > me.bumpCd) { me.bumpCd = now + 250; beep(900, 0.05, "sine", 0.06); }
    }
  }
  const g = me.m.ground;
  if (g && g.cp > me.cp && racing) { me.cp = g.cp; burst(me.m.p, "#3ddc84", 40, 6); beep(660, 0.12); setTimeout(() => beep(880, 0.18), 120); toast(`Checkpoint ${me.cp}!`); }
  if (g && g.goal && racing) finish(r);
  if (fallen(me.m)) { // fell off: back to the checkpoint
    me.m = newMarble(spawnAt(me.cp, me.slot)); me.m.li = course.cps[Math.min(me.cp, course.cps.length - 1)].li;
    burst(me.m.p, myColor, 16, 3); beep(200, 0.3, "sine", 0.1, 120); toast("Oops!", 900);
  }
  if (now - me.lastSend > 66) {
    me.lastSend = now; const f = (v) => +v.toFixed(2);
    net.me.set("m", JSON.stringify({ r: me.raceId, x: f(me.m.p.x), y: f(me.m.p.y), z: f(me.m.p.z), vx: f(me.m.v.x), vy: f(me.m.v.y), vz: f(me.m.v.z), cp: me.cp, s: +me.m.s.toFixed(1), ft: me.ft }));
  }
}
function finish(r) {
  me.ft = Math.round(clock() - r.startAt);
  if (!me.best || me.ft < me.best) me.best = me.ft;
  burst(me.m.p, myColor, 80, 8); beep(660, 0.15); setTimeout(() => beep(880, 0.15), 150); setTimeout(() => beep(1320, 0.35), 300);
  const place = racers().findIndex((x) => x.mine) + 1;
  toast(place === 1 ? "You win!" : `${ord(place)} place!`, 2600);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}.${Math.floor((ms % 1000) / 100)}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let toastTimer = 0;
function toast(text, ms = 1500) { if (ATTRACT) return; const m = $("msg"); m.textContent = text; m.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
let board = null, boardFor = -1, lastCount = "", started = 0;
function hud(r, now) {
  const wall = clock();
  const count = r.phase === "grid" && r.startAt - wall < 3000 ? String(Math.max(1, Math.ceil((r.startAt - wall) / 1000))) : r.phase === "race" && wall - r.startAt < 900 ? "GO!" : "";
  if (count !== lastCount) { lastCount = count; if (count === "GO!") beep(880, 0.4, "square", 0.08); else if (count) beep(440, 0.15, "square", 0.08); }
  $("count").textContent = count;
  if (ATTRACT) { for (const id of ["pos", "cp", "time", "net", "hint"]) $(id).textContent = ""; return; }
  const order = racers(), at = order.findIndex((x) => x.mine) + 1;
  $("pos").innerHTML = at ? `${ord(at)} <small>/ ${order.length}</small>` : "";
  $("cp").textContent = me.ft ? "At the goal!" : `Checkpoint ${me.cp}/${course.cps.length - 1}`;
  $("time").textContent = r.phase === "race" || r.phase === "done" ? fmt(me.ft || Math.max(0, wall - r.startAt)) : "";
  $("hint").textContent = r.phase === "grid" && r.startAt - wall >= 3000 ? "Next round starting…" : me.ft && r.phase === "race" ? "Waiting for the others…" :
    now - started < 14000 ? (touchUI ? "Left thumb to roll · JUMP over gaps" : "WASD or arrows to roll · Space to jump") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the race" : ""}`;
  $("over").hidden = r.phase !== "done";
  if (r.phase === "done") {
    $("results").innerHTML = r.results.map((x) => `<li class="${x.id === net.sessionId ? "me" : ""}"><i style="background:${esc(x.c || "#ccc")}"></i>${esc(x.n)}<span>${x.ft ? fmt(x.ft) : `checkpoint ${x.cp}`}</span></li>`).join("");
    $("next").textContent = `Next round in ${Math.max(0, Math.ceil((r.endsAt - wall) / 1000))}s`;
    if (boardFor !== r.id) { boardFor = r.id; showBoard(); }
  }
}
function showBoard() {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  const submit = me.ft && me.submitted !== me.raceId ? board.submit(Math.max(0, 600000 - me.ft)).catch(() => null) : Promise.resolve();
  me.submitted = me.raceId;
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(600000 - e.score)}</span></li>`).join("") : "<li class=\"note\">No runs yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
function again() { const r = race(); if (r && r.phase === "done" && isHost()) newRace(r.id + 1); }
$("again").onclick = () => { if (isHost()) again(); else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("stick").hidden = $("jumpBtn").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const KEYS = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
const wakeAudio = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } if (e.key === " ") { e.preventDefault(); if (!e.repeat) input.jump = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
addEventListener("blur", () => { input.up = input.down = input.left = input.right = input.jump = false; }); // a key held while the tab loses focus never sends its keyup
const stick = $("stick"), knob = $("knob");
let stickId = null;
function moveStick(e) {
  const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / 50, dy = (e.clientY - cy) / 50; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  input.sx = dx; input.sy = dy; knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`;
}
stick.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) moveStick(e); });
for (const ev of ["pointerup", "pointercancel"]) stick.addEventListener(ev, (e) => { if (e.pointerId !== stickId) return; stickId = null; input.sx = input.sy = 0; knob.style.transform = ""; });
const jumpBtn = $("jumpBtn");
jumpBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); input.jump = true; jumpBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) jumpBtn.addEventListener(ev, () => jumpBtn.classList.remove("on"));
cv.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, camYaw = 0;
const views = new Map(); // id -> drawn marble for everyone but me: { g, p, v, ... }
function viewOf(id, color, name) {
  let v = views.get(id);
  if (v && v.color !== color) { scene.remove(v.g); v.g = makeMarble(color, ATTRACT ? "" : name); v.color = color; } // they changed color
  if (!v) { v = { g: makeMarble(color, ATTRACT ? "" : name), color, p: new THREE.Vector3(), v: new THREE.Vector3(), sp: new THREE.Vector3(), sv: new THREE.Vector3(), raw: "", fresh: true, at: 0 }; views.set(id, v); }
  return v;
}
/** Ease a drawn marble toward where it said it was, plus how far it has rolled since. */
function follow(v, k, dt, now, exact) {
  if (exact) { v.p.set(k.x, k.y, k.z); v.v.set(k.vx, k.vy, k.vz); return; }
  const key = `${k.x},${k.y},${k.z}`;
  if (v.raw !== key) { v.raw = key; v.sp.set(k.x, k.y, k.z); v.sv.set(k.vx || 0, k.vy || 0, k.vz || 0); v.at = now; }
  const el = Math.min(0.25, (now - v.at) / 1000), tgt = _c.copy(v.sp).addScaledVector(v.sv, el);
  if (v.fresh || v.p.distanceTo(tgt) > 12) { v.p.copy(tgt); v.fresh = false; }
  v.p.lerp(tgt, 1 - Math.pow(0.0005, dt)); v.v.copy(v.sv);
}
/** What everyone should see another marble (a player's or a bot's) do: light the bumper it hits, throw confetti at the goal. */
function viewEffects(v, ft) {
  for (const bp of course.bumpers) if (Math.hypot(v.p.x - bp.c.x, v.p.z - bp.c.z) < bp.r + R + 0.25 && Math.abs(v.p.y - bp.c.y - R) < 1) bp.flash = 1;
  if (ft && v.ft === 0) burst(v.p, v.color, 40, 6); // v.ft is undefined on the frame we first see it: no confetti for a marble that finished before we looked
  v.ft = ft || 0;
}
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the race meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncClock(now);
  const t = clock() / 1000;
  updateCourse(t);
  if (isHost()) hostTick(dt, now, t); else host.wasHost = false;
  const r = race();
  if (r) myTick(dt, r, t, now);
  // everyone else's marbles
  const seen = new Set(), live = new Set(livePlayers()); // a closed tab can linger in state for a while: skip it
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const k = parse(p.m, null); if (!k || !r || k.r !== r.id) continue;
    seen.add(id); const v = viewOf(id, p.c || "#ccc", p.n || "Player"); follow(v, k, dt, now, false); placeMarble(v.g, v.p, v.v.x, v.v.z, dt); viewEffects(v, k.ft);
  }
  const exact = isHost();
  for (const b of botList()) { seen.add(b.i); const v = viewOf(b.i, b.c, b.n); follow(v, b, dt, now, exact); placeMarble(v.g, v.p, v.v.x, v.v.z, dt); viewEffects(v, b.ft); }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  if (!me.g) me.g = makeMarble(myColor, "");
  placeMarble(me.g, me.m.p, me.m.v.x, me.m.v.z, dt);
  // the course's moving parts
  course.boxes.forEach((b, i) => { if (b.amp || b.spin) { boxMeshes[i].position.copy(b.cNow); boxMeshes[i].quaternion.copy(b.q); } });
  course.bumpers.forEach((bp, i) => { bp.flash = Math.max(0, bp.flash - dt * 3); bumperMeshes[i].material.emissiveIntensity = bp.flash; bumperMeshes[i].scale.set(1 + bp.flash * 0.15, 1, 1 + bp.flash * 0.15); });
  flagMeshes.forEach((f, i) => { f.rotation.y = Math.sin(t * 3 + i) * 0.3; });
  trophy.rotation.y = t * 1.5;
  tickConfetti(dt);
  // camera: behind the marble, turning to face along the course
  const L = course.line, seg = L[me.m.li], nxt = L[Math.min(L.length - 1, me.m.li + 1)], want = Math.atan2(nxt.p.x - seg.p.x, nxt.p.z - seg.p.z);
  camYaw += Math.atan2(Math.sin(want - camYaw), Math.cos(want - camYaw)) * Math.min(1, dt * 2.5);
  const back = ATTRACT ? 8 : camera.aspect < 1 ? 9 : 8.5, high = ATTRACT ? 4.5 : camera.aspect < 1 ? 6.5 : 4.2; // a phone held upright looks down more
  camPos.set(me.m.p.x - Math.sin(camYaw) * back, me.m.p.y + high, me.m.p.z - Math.cos(camYaw) * back);
  camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
  camLook.set(me.m.p.x + Math.sin(camYaw) * 4, me.m.p.y + 0.3, me.m.p.z + Math.cos(camYaw) * 4);
  camera.lookAt(camLook);
  sun.position.copy(me.m.p).add(new THREE.Vector3(18, 40, 12)); sun.target.position.copy(me.m.p);
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  if (r && now - lastHud > 100) { lastHud = now; hud(r, now); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => again());
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countdown: 1000, resultsFor: 1500, seats: 7 });
  me.skill = 1; me.lane = 0.3;
  camera.position.set(me.m.p.x, me.m.p.y + 5, me.m.p.z - 10);
  started = performance.now();
  requestAnimationFrame(frame);
})();
</script>
